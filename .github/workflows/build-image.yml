# Builds the kirkus for Apple Silicon image on GitHub's ARM servers and (optionally) publishes it as a
# release. Run it from the Actions tab: "Build image" -> "Run workflow".
name: Build image

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version, YY.MM.DD (leave empty for today's date; a second build the same day becomes YY.MM.DD.1)"
        required: false
        default: ""
      publish:
        description: "What to do with the image"
        type: choice
        default: "Publish release"
        options:
          - "Publish release"
          - "Draft release (test it first, publish it yourself)"
          - "Just build (download it from this run)"
      notes:
        description: "Release notes (optional)"
        required: false
        default: ""

permissions:
  contents: write          # to create the tag and the release

concurrency:
  group: build-image
  cancel-in-progress: false

env:
  TZ: America/New_York     # "today's date" for the version

jobs:
  build:
    runs-on: ubuntu-24.04-arm      # 64-bit ARM, so nothing is emulated
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Choose the version
        env:
          INPUT_VERSION: ${{ inputs.version }}
          PUBLISH: ${{ inputs.publish }}
          GH_TOKEN: ${{ github.token }}
        run: |
          exists() { gh release view "$1" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; }
          v="$INPUT_VERSION"
          if [[ -z $v ]]; then
            v=$(date +%y.%m.%d); n=0
            while [[ $PUBLISH != Just* ]] && exists "$v"; do n=$((n + 1)); v="$(date +%y.%m.%d).$n"; done
          fi
          if ! [[ $v =~ ^[0-9]{2}\.[0-9]{2}\.[0-9]{2}(\.[0-9]+)?$ ]]; then
            echo "::error::Version must look like 26.11.18, got '$v'"; exit 1
          fi
          if [[ $PUBLISH != Just* ]] && exists "$v"; then
            echo "::error::A release called $v already exists. Delete it first, or enter a different version."
            exit 1
          fi
          echo "VERSION=$v" >> "$GITHUB_ENV"
          echo "Building kirkus $v for Apple Silicon"

      - name: Make room and install the build tools
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache || true
          sudo apt-get update -q
          sudo apt-get install -y -q libarchive-tools arch-install-scripts btrfs-progs zip rsync
          df -h /

      - name: Build the image (takes 30-90 minutes)
        run: sudo env KIRK_VERSION="$VERSION" KIRK_REPO="$GITHUB_REPOSITORY" ./build.sh

      - name: Check the size
        run: |
          sudo chown -R "$(id -u)" out
          zip=out/kirkus-$VERSION-asahi.zip
          size=$(stat -c %s "$zip")
          echo "$zip: $((size / 1024 / 1024)) MiB"
          if (( size >= 2 * 1024 * 1024 * 1024 )); then
            echo "::error::The image is 2 GiB or larger, over GitHub's limit for a release file. Leave some packages out (image/setup.sh)."
            exit 1
          fi
          cat out/*.sha256

      - name: Create the release
        if: ${{ !startsWith(inputs.publish, 'Just') }}
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISH: ${{ inputs.publish }}
          NOTES: ${{ inputs.notes }}
        run: |
          body="${NOTES:-kirkus $VERSION for Apple Silicon}

          **Install:** on an Apple Silicon Mac (M1 or M2), open Terminal in macOS and run:

              curl -fsSL https://github.com/$GITHUB_REPOSITORY/releases/latest/download/install.sh | sh

          Already running kirkus? This release is applied automatically after your next \`sudo pacman -Syu\`."
          draft=()
          [[ $PUBLISH == Draft* ]] && draft=(--draft)
          gh release create "$VERSION" out/* \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "kirkus $VERSION" --notes "$body" "${draft[@]}"

      - name: Keep the image with this run
        if: ${{ startsWith(inputs.publish, 'Just') }}
        uses: actions/upload-artifact@v4
        with:
          name: kirkus-${{ env.VERSION }}-asahi
          path: out/*
          retention-days: 7
          compression-level: 0
