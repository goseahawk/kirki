# Publishes the website (the site/ folder) to GitHub Pages whenever it changes on main.
# One-time setup: repository Settings → Pages → Source: "GitHub Actions".
#
# Two jobs, as in GitHub's own Pages template: the deploy job only starts once the upload job has
# finished, so the uploaded site is always findable. (In one job, deploy-pages sometimes looked for it
# a moment too early and failed with "No artifacts named github-pages were found".)
name: Website

on:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/website.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: website
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
