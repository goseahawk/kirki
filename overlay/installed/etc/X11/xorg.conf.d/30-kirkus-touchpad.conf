# kirkus: tap to click on every touchpad. This covers everything that runs on the X server: the
# first-start setup and the login screen. (Plasma has its own setting, also on by default.)
Section "InputClass"
    Identifier "kirkus touchpad tap to click"
    MatchIsTouchpad "on"
    MatchDriver "libinput"
    Option "Tapping" "on"
    Option "TappingDrag" "on"
EndSection
