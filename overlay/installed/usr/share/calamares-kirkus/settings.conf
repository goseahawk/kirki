# kirkus first-start setup (Calamares), shown once on the first start after installing.
# Started by kirk-setup.service through /usr/local/bin/kirk-setup. Everything is already installed;
# this only asks for the language, time zone, keyboard and your account, then hands over to the
# login screen. Modelled on Asahi ALARM's own first-boot setup (asahi-calamares-configs, MIT).
---
modules-search: [ local ]

instances:
- id:       finish
  module:   shellprocess
  config:   shellprocess-finish.conf

sequence:
- show:
  - welcome
  - locale
  - keyboard
  - users
  - summary
- exec:
  - locale
  - keyboard
  - localecfg
  - users
  - shellprocess@finish
- show:
  - finished

branding: kirkus

# A setup program on the running system, not an installer: no chroot, nothing to partition.
prompt-install: false
dont-chroot: true
oem-setup: true
# Setup has to finish before anyone can log in, so there's nothing to cancel to.
disable-cancel: true
disable-cancel-during-exec: true
hide-back-and-next-during-exec: true
quit-at-end: false
