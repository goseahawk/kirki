# One account, which can use sudo. root stays locked, as on kirkus for PCs.
---
defaultGroups:
    - name: wheel
      must_exist: false
      system: true
    - lp
    - video
    - network
    - storage
    - audio
doAutologin:     false
sudoersGroup:    wheel
sudoersConfigureWithGroup: false
setRootPassword: false
doReusePassword: true
passwordRequirements:
    nonempty: true
allowWeakPasswords: false
allowWeakPasswordsDefault: false
userShell: /bin/bash
setHostname: EtcFile
writeHostsFile: true
