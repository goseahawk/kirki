# Time zone: suggested from the internet connection (as the kirkus PC installer does, with the
# same service); New York if there's no connection yet. Wi-Fi can be set up after logging in.
---
region:         "America"
zone:           "New_York"
localeGenPath:  "/etc/locale.gen"
geoip:
    style:      "json"
    url:        "https://ipapi.co/json"
    selector:   "timezone"
